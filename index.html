<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الوصول</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b14; --card:rgba(16,24,38,.75); --line:rgba(255,255,255,.08);
  --text:#eef2ff; --muted:#8b93a7; --gold:#e7b45a; --gold2:#f6d489;
}
body{font-family:'Cairo',sans-serif;background:
  radial-gradient(1100px 600px at 85% -10%, rgba(231,180,90,.08), transparent 60%),
  radial-gradient(900px 500px at 10% 110%, rgba(79,140,255,.07), transparent 60%),
  var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
#lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(4,7,14,.9);backdrop-filter:blur(14px);transition:opacity .5s,visibility .5s}
#lock.off{opacity:0;visibility:hidden}
.lock-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 26px;
  width:min(94vw,380px);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.lock-logo{width:70px;height:70px;margin:0 auto 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 10px 30px rgba(231,180,90,.35);font-size:32px}
.lock-card h1{font-size:22px;font-weight:800}
.lock-card p{color:var(--muted);font-size:13px;margin-top:4px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 6px}
.dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--gold);transition:.2s}
.dots span.on{background:var(--gold);box-shadow:0 0 14px rgba(231,180,90,.6)}
.err{height:20px;color:#ff7a7a;font-size:12px;opacity:0;transition:.2s}
.err.show{opacity:1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.key{height:56px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--text);font-size:21px;font-weight:700;font-family:'Cairo';cursor:pointer;transition:.15s}
.key:hover{background:rgba(255,255,255,.12)}
.key:active{transform:scale(.93)}
.key.fn{font-size:15px;color:var(--muted)}
.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.wrap{max-width:1150px;margin:auto;padding:26px 18px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.title{font-size:clamp(20px,4vw,30px);font-weight:900;background:linear-gradient(90deg,var(--gold2),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);font-size:12px}
.btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:9px 14px;font-family:'Cairo';font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(255,255,255,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--gold2)}
.stat span{color:var(--muted);font-size:12px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.searchbox{position:relative;flex:1;min-width:200px}
.searchbox svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.searchbox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);
  padding:13px 44px 13px 16px;font-family:'Cairo';font-size:14px;outline:none;transition:.2s}
.searchbox input:focus{border-color:var(--gold)}
select{background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);
  padding:10px 14px;font-family:'Cairo';font-size:13px;outline:none;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);border-radius:999px;
  padding:7px 18px;font-family:'Cairo';font-weight:700;font-size:12.5px;cursor:pointer;transition:.2s}
.chip.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1206;border-color:transparent}
.rescount{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.oil{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;transition:.25s;animation:up .4s both}
.oil:hover{transform:translateY(-4px);border-color:rgba(231,180,90,.4);box-shadow:0 14px 40px rgba(0,0,0,.4)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.code{color:var(--muted);font-size:11.5px;letter-spacing:.5px;direction:ltr}
.badge{border-radius:999px;padding:3px 12px;font-size:11px;font-weight:700}
.b-m{background:rgba(79,140,255,.15);color:#7fb1ff}
.b-w{background:rgba(255,107,157,.15);color:#ff8fb8}
.b-u{background:rgba(167,139,250,.15);color:#c0aaff}
.b-s{background:rgba(148,163,184,.15);color:#aeb9cc}
.name{font-size:15.5px;font-weight:800;margin-bottom:10px;min-height:24px}
.qty{font-size:24px;font-weight:900;color:var(--gold2)}
.qty small{font-size:12px;color:var(--muted);font-weight:600}
.loc{color:var(--muted);font-size:12.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:9px}
.loc b{color:var(--text)}
mark{background:var(--gold);color:#1a1206;border-radius:4px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px;line-height:2}
.empty div{font-size:44px;margin-bottom:10px}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:40px}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card" id="lockCard">
    <div class="lock-logo">💧</div>
    <h1>مخزون الزيوت</h1>
    <p>أدخل رمز الوصول للمتابعة</p>
    <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
    <div class="err" id="err">رمز غير صحيح، حاول مجددًا</div>
    <div class="keypad" id="keypad">
      <button class="key" data-d="1">1</button><button class="key" data-d="2">2</button><button class="key" data-d="3">3</button>
      <button class="key" data-d="4">4</button><button class="key" data-d="5">5</button><button class="key" data-d="6">6</button>
      <button class="key" data-d="7">7</button><button class="key" data-d="8">8</button><button class="key" data-d="9">9</button>
      <button class="key fn" id="clr">مسح</button><button class="key" data-d="0">0</button><button class="key fn" id="del">⌫</button>
    </div>
  </div>
</div>

<main id="app" class="hidden">
  <div class="wrap">
    <div class="top">
      <div><div class="title">💧 مخزون الزيوت</div><div class="subtitle">يقرأ البيانات تلقائيًا من data.xlsx</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="fileBtn" title="فتح ملف Excel من جهازك">📂</button>
        <button class="btn" id="reloadBtn" title="تحديث البيانات من الموقع">🔄</button>
        <button class="btn" id="lockBtn">🔒 قفل</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
    <div class="stats">
      <div class="stat"><b id="stCount">0</b><span>صنف زيت</span></div>
      <div class="stat"><b id="stQty">0</b><span>إجمالي الكمية (غ)</span></div>
      <div class="stat"><b id="stCab">0</b><span>خزانة</span></div>
    </div>
    <div class="controls">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="ابحث باسم الزيت، الكود، الخزانة...">
      </div>
      <select id="sort">
        <option value="name">ترتيب: الاسم</option>
        <option value="qd">الكمية: الأعلى أولًا</option>
        <option value="qa">الكمية: الأقل أولًا</option>
        <option value="code">الكود</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="rescount" id="resCount"></div>
    <div class="grid" id="grid"></div>
    <footer>للاستخدام الداخلي فقط</footer>
  </div>
</main>

<script>
const PIN = "0000"; // 🔑 غيّر كلمة السر من هنا
let DATA = [];
const state = {q:"", cat:"الكل", sort:"name"};
const badge = {"رجالي":"b-m","نسائي":"b-w","للجنسين":"b-u","مستودع":"b-s","أخرى":"b-s"};
const grid = document.getElementById("grid");

/* ===== قراءة ملف الإكسل ===== */
async function loadData(){
  grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div>⏳</div>جارٍ تحميل البيانات...</div>`;
  try{
    const res = await fetch("data.xlsx?v="+Date.now());
    if(!res.ok) throw 0;
    parseWB(XLSX.read(await res.arrayBuffer()));
  }catch(e){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div>📂</div>
      لم يتم العثور على ملف data.xlsx في المستودع.<br>
      ارفعه بجانب index.html أو اضغط 📂 لفتحه من جهازك.</div>`;
  }
}
function parseWB(wb){
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:""});
  const hi = rows.findIndex(r => r.some(c => String(c).includes("اسم الزيت")));
  const headers = (rows[hi]||[]).map(h=>String(h));
  const iN  = headers.findIndex(h=>h.includes("اسم الزيت"));
  const iC  = headers.findIndex(h=>h.includes("كود"));
  const iQ  = headers.findIndex(h=>h.includes("الكمية"));
  const iCab= headers.findIndex(h=>h.includes("الخزانة"));
  const iSh = headers.findIndex(h=>h.includes("الرف"));
  const CATS = ["رجالي","نسائي","للجنسين","مستودع"];
  DATA = [];
  for(let i=(hi<0?0:hi+1); i<rows.length; i++){
    const r = rows[i], raw = String(r[iN]??"").trim();
    if(!raw) continue;
    let name = raw, cat = "أخرى";
    const seg = raw.split(/\s*-\s*/), last = seg[seg.length-1].trim();
    if(CATS.includes(last)){ cat = last; name = seg.slice(0,-1).join(" - ").trim() || raw; }
    DATA.push({
      n: name,
      c: String(r[iC]??"").trim() || "—",
      q: Number(String(r[iQ]??"").replace(/[,،]/g,"")) || 0,
      cab: String(r[iCab]??"").trim() || "-",
      sh: String(r[iSh]??"").trim() || "-",
      t: cat
    });
  }
  buildChips(); render();
}
function buildChips(){
  const order = ["رجالي","نسائي","للجنسين","مستودع","أخرى"];
  state.cat = "الكل";
  document.getElementById("chips").innerHTML =
    `<button class="chip active" data-cat="الكل">الكل (${DATA.length})</button>` +
    order.filter(c=>DATA.some(o=>o.t===c))
         .map(c=>`<button class="chip" data-cat="${c}">${c}</button>`).join("");
}

/* ===== الأزرار ===== */
document.getElementById("fileBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  parseWB(XLSX.read(await f.arrayBuffer()));
};
document.getElementById("reloadBtn").onclick = loadData;
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  c.classList.add("active"); state.cat = c.dataset.cat; render();
});

/* ===== العرض ===== */
function hl(name,q){
  if(!q) return name;
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  return i<0 ? name : name.slice(0,i)+"<mark>"+name.slice(i,i+q.length)+"</mark>"+name.slice(i+q.length);
}
function render(){
  const q = state.q.trim().toLowerCase();
  let list = DATA.filter(o=>{
    const hay = (o.n+" "+o.c+" "+o.t+" "+o.cab+" "+o.sh).toLowerCase();
    return (state.cat==="الكل"||o.t===state.cat) && (!q||hay.includes(q));
  });
  if(state.sort==="qd") list.sort((a,b)=>b.q-a.q);
  else if(state.sort==="qa") list.sort((a,b)=>a.q-b.q);
  else if(state.sort==="code") list.sort((a,b)=>a.c.localeCompare(b.c));
  else list.sort((a,b)=>a.n.localeCompare(b.n,"ar"));
  document.getElementById("stCount").textContent = list.length;
  document.getElementById("stQty").textContent = list.reduce((s,o)=>s+o.q,0).toLocaleString("en-US");
  document.getElementById("stCab").textContent = new Set(list.filter(o=>/^\d/.test(o.cab)).map(o=>o.cab)).size;
  document.getElementById("resCount").textContent = "النتائج: "+list.length;
  grid.innerHTML = list.map(o=>`
    <article class="oil">
      <div class="row1"><span class="badge ${badge[o.t]||"b-s"}">${o.t}</span><span class="code">${o.c}</span></div>
      <h3 class="name">${hl(o.n,q)}</h3>
      <div class="qty">${o.q.toLocaleString("en-US")} <small>غ</small></div>
      <div class="loc">📍 <b>${/^\d/.test(o.cab)?"خزانة "+o.cab:o.cab}</b>${o.sh!=="-"?" · رف <b>"+o.sh+"</b>":""}</div>
    </article>`).join("")
    || `<div class="empty" style="grid-column:1/-1"><div>🔍</div>لا توجد نتائج مطابقة</div>`;
}

/* ===== القفل ===== */
let entered = "";
const dots = [...document.querySelectorAll("#dots span")];
const lockCard = document.getElementById("lockCard");
const updateDots = () => dots.forEach((s,i)=>s.classList.toggle("on", i<entered.length));
document.getElementById("keypad").addEventListener("click", e=>{
  const k = e.target.closest("button"); if(!k) return;
  if(k.dataset.d!==undefined){
    if(entered.length>=4) return;
    entered += k.dataset.d; updateDots();
    if(entered.length===4) setTimeout(validate,180);
  } else if(k.id==="del"){ entered = entered.slice(0,-1); updateDots(); }
  else { entered = ""; updateDots(); }
});
function validate(){
  if(entered===PIN){ sessionStorage.setItem("oil_pin","1"); openApp(); }
  else{
    document.getElementById("err").classList.add("show");
    lockCard.classList.add("shake");
    setTimeout(()=>{ lockCard.classList.remove("shake"); entered=""; updateDots();
      document.getElementById("err").classList.remove("show"); },650);
  }
}
function openApp(){
  document.getElementById("lock").classList.add("off");
  document.getElementById("app").classList.remove("hidden");
  loadData();
}
document.getElementById("lockBtn").onclick = () => { sessionStorage.removeItem("oil_pin"); location.reload(); };
if(sessionStorage.getItem("oil_pin")==="1") openApp();
</script>
</body>
</html>
